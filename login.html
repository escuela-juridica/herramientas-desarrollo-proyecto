<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión | Escuela Jurídica</title>
<meta name="description" content="Acceso administrativo — Escuela Jurídica. Proyecto del curso Herramientas de Desarrollo, UTP.">
<link rel="icon" type="image/png" sizes="32x32" href="img/identidad/favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/login.css">

</head>
<body class="login-page">

<header class="login-header">
  <nav class="login-nav" aria-label="Navegación de acceso">
    <a href="inicio.html" class="login-logo"><img src="img/identidad/logo.png" alt="Logo de Escuela Jurídica"></a>
    <a href="inicio.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Volver al sitio web</a>
  </nav>

  <section class="login-visual" aria-label="Banner administrativo">
    <div class="visual-body">
      <div class="visual-card">
        <div class="visual-top">
          <div class="icon"><i class="fa-solid fa-shield-halved"></i></div>
          <span class="badge">Acceso restringido</span>
        </div>
        <h1>Panel administrativo</h1>
        <p class="sub">Portal exclusivo para el equipo de Escuela Jurídica.</p>
      </div>
    </div>
  </section>
</header>

<main class="login-main">
  <section class="login-form-area">
    <div class="form-inner">
      <p class="eyebrow">Administración</p>
      <h2>Iniciar sesión</h2>
      <p class="sub">Ingresa tus credenciales para acceder al panel.</p>

      <form>
        <div class="field">
          <label for="l-mail"><i class="fa-solid fa-envelope"></i> Correo electrónico</label>
          <input id="l-mail" type="email" required placeholder="tucorreo@ejemplo.com" autocomplete="username">
        </div>
        <div class="field">
          <label for="l-pass"><i class="fa-solid fa-key"></i> Contraseña</label>
          <input id="l-pass" type="password" required minlength="8" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="site-button button-primary"><i class="fa-solid fa-right-to-bracket"></i> Ingresar</button>
        <a class="help-link">¿Necesitas recuperar el acceso?</a>
      </form>
    </div>
  </section>
</main>

<footer class="login-footer">
  <p class="copyright">&copy; 2026 Escuela Jurídica · Área administrativa</p>
</footer>

</body>
</html>
