spring.application.name=escuela-juridica
server.port=8500

# Carpeta externa donde se guardan las imagenes de cursos (semilla + subidas del admin).
# Ruta relativa al directorio de trabajo del proceso (la raiz del proyecto al correrlo con IntelliJ/mvnw).
app.upload-dir=uploads/cursos

# El limite por defecto de Spring Boot es 1MB por archivo, insuficiente para fotos de cursos.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
