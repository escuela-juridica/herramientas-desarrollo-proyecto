<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title layout:title-pattern="$CONTENT_TITLE | Panel administrativo">Panel administrativo</title>
  <meta name="description" content="Panel administrativo — Escuela Jurídica. Proyecto del curso Herramientas de Desarrollo, UTP.">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/identidad/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/admin/admin.css">
  <th:block layout:fragment="css"></th:block>
</head>

<body class="admin-page">

  <aside class="admin-sidebar">
    <input class="admin-toggle" type="checkbox" id="adminToggle">

    <div class="admin-sidebar-top">
      <a href="/inicio" class="admin-brand">
        <img src="/img/identidad/favicon.png" alt="Logo de Escuela Jurídica">
        <span>Escuela Jurídica</span>
      </a>
      <label class="admin-menu-btn" for="adminToggle" aria-label="Abrir menú"><i class="fa-solid fa-bars"></i></label>
    </div>

    <div class="admin-collapsible">
      <div class="admin-perfil" th:if="${adminActual != null}">
        <div class="admin-avatar"
             th:text="${#strings.substring(adminActual.nombres,0,1)} + ${#strings.substring(adminActual.apellidos,0,1)}">MC</div>
        <div>
          <p class="admin-nombre" th:text="${adminActual.nombres} + ' ' + ${adminActual.apellidos}">Nombre Apellido</p>
          <p class="admin-rol">Administrador</p>
        </div>
      </div>

      <nav class="admin-nav" aria-label="Navegación del panel">
        <a href="/admin/cursos" class="admin-nav-link" th:classappend="${activeAdmin == 'cursos'} ? ' on'">
          <i class="fa-solid fa-graduation-cap"></i> Cursos
        </a>
        <a href="#" class="admin-nav-link admin-nav-disabled">
          <i class="fa-solid fa-chart-line"></i> Dashboard <span class="admin-tag">Pronto</span>
        </a>
      </nav>

      <a href="/inicio" class="admin-salir"><i class="fa-solid fa-arrow-left"></i> Volver al sitio</a>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-topbar">
      <div>
        <p class="admin-eyebrow">Panel administrativo</p>
        <h1 th:text="${tituloAdmin}">Título</h1>
      </div>
      <form th:action="@{/logout}" method="post" class="admin-logout-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="admin-logout"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</button>
      </form>
    </header>

       <div layout:fragment="content"></div>
  </main>

  <th:block layout:fragment="js"></th:block>
</body>
</html>
